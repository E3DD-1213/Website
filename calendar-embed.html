<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Availability</title>

<!-- FullCalendar v6 (core + day/time/list views + interaction) -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<!-- ical.js must load BEFORE the iCalendar plugin -->
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.15/index.global.min.js"></script>

<style>
  /* === Site design tokens (mirrors base.css + gradient.css) === */
  :root {
    --glass-fill:          rgba(10, 12, 18, 0.74);
    --glass-fill-enhanced: rgba(10, 12, 18, 0.56);
    --glass-border:        rgba(255, 255, 255, 0.12);
    --glass-shadow:        rgba(0, 0, 0, 0.22);

    /* FullCalendar theme */
    --fc-page-bg-color:             transparent;
    --fc-border-color:              rgba(255, 255, 255, 0.12);
    --fc-today-bg-color:            rgba(255, 255, 255, 0.04);
    --fc-neutral-bg-color:          rgba(10, 12, 18, 0.40);
    --fc-neutral-text-color:        #a0a0a0;
    --fc-list-event-hover-bg-color: rgba(255, 255, 255, 0.05);

    /* Busy event blocks — matches site's primary blue */
    --busy-bg:     #0d6efd;
    --busy-border: #0b5ed7;
    --busy-text:   #ffffff;

    --accent: #0d6efd;
    --font:   -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* === Base dark body + site gradient === */
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: #f5f5f5;
    font-family: var(--font);
  }

  body {
    padding: 0;
  }

  /* === Liquid-glass calendar card (mirrors .calendar-frame in calendar.css) === */
  #calendar-wrap {
    max-width: 920px;
    margin: 0 auto;
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow:
      0 10px 30px var(--glass-shadow),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
    padding: 1.25rem;
    overflow: hidden;
  }

  @supports ((-webkit-backdrop-filter: blur(14px)) or (backdrop-filter: blur(14px))) {
    #calendar-wrap {
      background: var(--glass-fill-enhanced);
      -webkit-backdrop-filter: blur(14px) saturate(112%);
              backdrop-filter: blur(14px) saturate(112%);
    }
  }

  /* === FullCalendar dark-mode overrides === */

  /* All grid cells / tables transparent */
  .fc table,
  .fc td,
  .fc th,
  .fc-scrollgrid,
  .fc-scrollgrid-section > td,
  .fc-timegrid-col,
  .fc-daygrid-day { background: transparent !important; }

  /* Today column tint */
  .fc .fc-timegrid-col.fc-day-sat,
  .fc .fc-timegrid-col.fc-day-sun,
  .fc .fc-col-header-cell.fc-day-sat,
  .fc .fc-col-header-cell.fc-day-sun { background: rgba(255, 255, 255, 0.02) !important; }

  .fc .fc-timegrid-col.fc-day-today,
  .fc .fc-col-header-cell.fc-day-today { background: rgba(255, 255, 255, 0.05) !important; }

  /* Grid borders */
  .fc-theme-standard td,
  .fc-theme-standard th { border-color: rgba(255, 255, 255, 0.10); }
  .fc .fc-timegrid-slot       { border-color: rgba(255, 255, 255, 0.08) !important; height: 16px; }
  .fc .fc-timegrid-slot-minor { border-top-color: transparent !important; }

  /* General text */
  .fc { color: #f5f5f5; }

  .fc .fc-col-header-cell-cushion,
  .fc .fc-timegrid-axis-cushion,
  .fc .fc-daygrid-day-number { color: #a0a0a0; font-weight: 600; text-decoration: none; }

  .fc-direction-ltr .fc-timegrid-slot-label { text-align: left; }

  .fc .fc-toolbar-title { font-size: 1.15rem; font-weight: 700; color: #f5f5f5; }

  /* Today number highlight */
  .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: #0d6efd; }

  /* List view */
  .fc-list-day-cushion { background: rgba(255, 255, 255, 0.04) !important; }
  .fc .fc-list-day-text,
  .fc .fc-list-day-side-text { color: #a0a0a0 !important; text-decoration: none; }
  .fc .fc-list-event:hover td { background: rgba(255, 255, 255, 0.05) !important; }
  .fc .fc-list-empty { background: transparent; color: #a0a0a0; }
  .fc .fc-list-table td { border-color: rgba(255, 255, 255, 0.08); }

  /* Toolbar buttons — match site's #0d6efd blue */
  .fc .fc-button-primary {
    background:   var(--accent);
    border-color: var(--accent);
    text-transform: none;
    box-shadow: none;
    font-family: var(--font);
    font-weight: 600;
  }
  .fc .fc-button-primary:not(:disabled):hover {
    background:   var(--busy-border);
    border-color: var(--busy-border);
  }
  .fc .fc-button-primary:not(:disabled).fc-button-active {
    background:   rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .fc .fc-button-primary:focus { box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.35); }

  /* Busy event blocks */
  .fc .busy-event {
    background:    var(--busy-bg);
    border:        none;
    border-left:   3px solid var(--busy-border);
    color:         var(--busy-text);
    border-radius: 6px;
    padding:       1px 4px;
    font-weight:   600;
    font-size:     0.78rem;
    opacity:       0.90;
  }
  .fc .busy-event:hover { opacity: 1; }
  .fc-event-time { font-weight: 500; }

  /* Now indicator */
  .fc .fc-timegrid-now-indicator-line { border-color: #0d6efd; }
  .fc .fc-timegrid-now-indicator-arrow { border-top-color: #0d6efd; border-bottom-color: #0d6efd; }

  /* Status text below calendar */
  #cal-status {
    font: 13px var(--font);
    color: #a0a0a0;
    text-align: center;
    margin-top: 0.75rem;
  }
</style>
</head>
<body>
  <div id="calendar-wrap">
    <div id="calendar"></div>
    <p id="cal-status"></p>
  </div>

<script>
  const CONFIG = {
    FEED_URL:             "https://calendar-stripped.ew3d.workers.dev/busy.ics",
    INITIAL_VIEW:         "timeGridWeek",
    SLOT_MIN_TIME:        "09:00:00",
    SLOT_MAX_TIME:        "24:00:00",
    FIRST_DAY:            0,
    BUSINESS_HOURS_ONLY:  false,
    TIME_ZONE:            "local",
  };

  document.addEventListener("DOMContentLoaded", function () {
    const statusEl = document.getElementById("cal-status");
    const calendar = new FullCalendar.Calendar(
      document.getElementById("calendar"),
      {
        initialView:  CONFIG.INITIAL_VIEW,
        timeZone:     CONFIG.TIME_ZONE,
        firstDay:     CONFIG.FIRST_DAY,
        slotMinTime:  CONFIG.SLOT_MIN_TIME,
        slotMaxTime:  CONFIG.SLOT_MAX_TIME,
        weekends:     !CONFIG.BUSINESS_HOURS_ONLY,
        nowIndicator: true,
        allDaySlot:   false,
        height:       "auto",
        slotLabelFormat: { hour: "numeric", hour12: true },
        headerToolbar: {
          left:   "prev,next today",
          center: "title",
          right:  "timeGridWeek,timeGridDay,listWeek",
        },
        buttonText: { today: "Today", week: "Week", day: "Day", list: "List" },
        eventSources: [
          { url: CONFIG.FEED_URL, format: "ics" },
        ],
        eventClassNames: "busy-event",
        eventContent: function () {
          // Render an untitled block — no text, just the colored slot.
          return { html: '<div class="fc-event-title">&nbsp;</div>' };
        },
        loading: function (isLoading) {
          statusEl.textContent = isLoading ? "Loading availability…" : "";
        },
        eventDidMount: function (info) {
          info.el.removeAttribute("title"); // no hover tooltip either
        },
      }
    );

    calendar.render();

    fetch(CONFIG.FEED_URL, { method: "GET" }).catch(function () {
      statusEl.textContent = "Couldn't reach the calendar feed. Check CONFIG.FEED_URL.";
    });
  });
</script>

<script>
  (() => {
    window.addEventListener('mousemove', e => {
      try {
        const frames = window.parent.document.querySelectorAll('iframe');
        let self;
        for (const f of frames) { if (f.contentWindow === window) { self = f; break; } }
        if (!self) return;
        const rect = self.getBoundingClientRect();
        window.parent.dispatchEvent(new MouseEvent('mousemove', {
          clientX: rect.left + e.clientX,
          clientY: rect.top + e.clientY,
          bubbles: true,
          cancelable: true,
        }));
      } catch (_) {}
    });
  })();
</script>
</body>
</html>
